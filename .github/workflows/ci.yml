name: Library CI

# The library is published to npm by hand: every pull request and every
# push to main runs the shared checks of the organization (types, lint,
# spelling, unused code, tests, build, package contents):
# https://github.com/variamosple/.github/blob/main/.github/workflows/npm-package-ci.yml

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: variamosple/.github/.github/workflows/npm-package-ci.yml@v1

  # The package accepts React 18 or 19, and the PLE and the laboratory use
  # React 18: the tests also run with it (ADM-N10). Coverage is checked
  # once, by the shared checks.
  react-18:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Locked versions and checksums in ci/react-18/package-lock.json; its
      # dependencies are nested under react and react-dom, so the packages
      # of the main lockfile (scheduler of React 19, js-tokens) stay as they are
      - name: Install React 18
        run: |
          npm ci --ignore-scripts --prefix ci/react-18
          for pkg in react react-dom; do
            rm -rf "node_modules/$pkg"
            cp -R "ci/react-18/node_modules/$pkg" node_modules/
            mkdir -p "node_modules/$pkg/node_modules"
            find ci/react-18/node_modules -mindepth 1 -maxdepth 1 \
              ! -name '.*' ! -name 'react' ! -name 'react-dom' \
              -exec cp -R {} "node_modules/$pkg/node_modules/" \;
          done
          node -e 'console.log("react", require("react").version, "react-dom", require("react-dom").version)'

      - name: Run unit tests with React 18
        run: npx vitest run
